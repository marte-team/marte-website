<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <meta
      name="description"
      content="MARTÉ helps businesses turn complex CRM systems and marketing automation platforms into growth engines."
    />

    <meta
      name="keywords"
      content="MARTÉ, CRM management, CRM implementation, marketing automation, growth marketing, email deliverability"
    />

    <meta name="theme-color" content="#050505" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="alternate icon" href="/logo/marte-logo-transparent.png" />

    <title>MARTÉ | CRM & Marketing Systems Built for Growth</title>

    <script>
      // Immediately reset scroll restoration so page refresh always starts at top
      if ('scrollRestoration' in history) {
        history.scrollRestoration = 'manual';
      }
      window.scrollTo(0, 0);

      // If user refreshed while on any subpage, immediately return to Home page
      try {
        var isReload = false;
        if (window.performance) {
          var navEntries = performance.getEntriesByType ? performance.getEntriesByType('navigation') : [];
          if (navEntries.length > 0 && navEntries[0].type === 'reload') {
            isReload = true;
          } else if (performance.navigation && performance.navigation.type === 1) {
            isReload = true;
          }
        }
        if (sessionStorage.getItem('marte_reload_to_home') === 'true') {
          isReload = true;
          sessionStorage.removeItem('marte_reload_to_home');
        }
        if (isReload && window.location.pathname !== '/' && window.location.pathname !== '') {
          window.history.replaceState(null, '', '/');
        }
      } catch (e) {}

      window.addEventListener('beforeunload', function () {
        try {
          sessionStorage.setItem('marte_reload_to_home', 'true');
        } catch (e) {}
      });
    </script>
  </head>

  <body>
    <div id="root"></div>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
